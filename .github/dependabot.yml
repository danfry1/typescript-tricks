version: 2
updates:
  # Only GitHub Actions: TypeScript is pinned on purpose, because CI and the README name exact versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release, so a bad or hijacked version has time to be pulled.
    cooldown:
      default-days: 7
    # One PR for all action bumps, since they all edit the same workflow lines.
    groups:
      actions:
        patterns: ["*"]
